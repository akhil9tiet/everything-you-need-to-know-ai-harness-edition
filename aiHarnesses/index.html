<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Articles — AI Harness Landscape</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="page">
  <section style="max-width:820px;padding:clamp(10px,3vw,34px) 0 20px;border-bottom:1px solid var(--faint)">
    <div class="eyebrow">Writing</div>
    <h1>Articles</h1>
    <p class="lede">Long-form research and landscape maps on the AI products and systems worth tracking.</p>
  </section>

  <section>
    <div class="controls">
      <div class="control-row articles-row">
        <label class="field" aria-label="Sort articles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 5h14"/><path d="m3 12h9"/><path d="m3 19h5"/><path d="m14 7 4-3v15"/></svg><select id="articleSort"><option value="added">Newest first</option><option value="updated">Recently updated</option><option value="popular">Most popular</option></select></label>
        <div class="view-toggle" role="group" aria-label="Layout"><button type="button" data-view="tiles" class="active">Tiles</button><button type="button" data-view="list">List</button></div>
      </div>
      <div class="result-line" id="articleCount"></div>
    </div>
    <div id="articles" class="articles"></div>
    <div id="articlesEmpty" class="empty">No articles published yet.</div>
  </section>

  <footer class="footer">Research snapshot: September 2026.</footer>
</main>
<script src="js/articles.js"></script>
<script src="js/articles-app.js"></script>
<script src="js/site.js"></script>
</body>
</html>
